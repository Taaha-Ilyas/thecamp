<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d140c">
<title>The Camp — Tower Defence</title>
<meta name="description" content="The Camp: defend your camp from endless waves of fantasy monsters. 100+ enemies, elite waves, 10 unique bosses.">
<meta property="og:title" content="The Camp">
<meta property="og:description" content="Hold the line. Survive the waves. 100+ enemies, elite waves and 10 unique bosses.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232a1d12'/%3E%3Cpath d='M8 50 L32 14 L56 50 Z' fill='%23c9932e'/%3E%3Cpath d='M26 50 L32 34 L38 50Z' fill='%231a0f06'/%3E%3Ccircle cx='32' cy='56' r='4' fill='%23ff8a30'/%3E%3C/svg%3E">
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0a120a;color:#f3e9d2;font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#cv{position:fixed;inset:0;display:block}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
kbd{font-family:inherit;font-size:10px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:0 4px;margin-left:4px;opacity:.85}
.serif{font-family:Georgia,'Times New Roman',serif}
:root{--gold:#ffcf5a;--gold2:#c9932e;--wood:#2a1d12;--wood2:#3b2918;--line:rgba(255,207,90,.35);--panel:rgba(22,15,9,.92)}
.btn{background:linear-gradient(#5a3d22,#3b2716);border:1px solid #8a6434;border-bottom-width:3px;border-radius:10px;padding:10px 18px;font-weight:700;letter-spacing:.5px;box-shadow:0 3px 10px rgba(0,0,0,.4);transition:transform .08s,filter .15s;color:#ffe9b8}
.btn:hover{filter:brightness(1.2)}.btn:active{transform:translateY(2px)}
.btn.gold{background:linear-gradient(#ffd97a,#d89a2c);color:#2a1606;border-color:#fff0b0 #b07a20 #8a5a10}
.btn.red{background:linear-gradient(#a8342a,#6a1a14);border-color:#d05a4a}
.btn.small{padding:6px 12px;font-size:13px}
.btn:disabled{filter:grayscale(.8) brightness(.6);cursor:default}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#hud button{pointer-events:auto}
.bar{position:relative;height:16px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.25);border-radius:9px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(#ff6a5a,#c02a20);transition:width .15s}
.bar span{position:absolute;inset:0;text-align:center;font-size:11px;line-height:15px;font-weight:700;text-shadow:0 1px 2px #000}
.bar.big{height:20px}.bar.big span{line-height:19px;font-size:12px}
#campBar i{background:linear-gradient(#ffcf5a,#c97a1e)}
.bar.boss{height:18px;border-color:#ff5a5a}.bar.boss i{background:linear-gradient(#ff3a5a,#8a0a2a)}
.bar.hp i{background:linear-gradient(#6ee07a,#2a9a3a)}
#hudTL{position:absolute;left:14px;top:12px;width:210px}
#waveLbl{font-family:Georgia,serif;font-size:30px;font-weight:900;letter-spacing:2px;color:var(--gold);text-shadow:0 2px 0 #5a3a10,0 3px 10px #000}
#waveSub{font-size:13px;opacity:.9;margin:2px 0 6px;text-shadow:0 1px 2px #000}
#waveBar{height:6px;background:rgba(0,0,0,.5);border-radius:3px;overflow:hidden}#waveBar i{display:block;height:100%;background:#ff8a3a;width:0}
#hudTop{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:min(420px,46vw);text-align:center}
.campName{font-family:Georgia,serif;font-size:13px;color:var(--gold);margin-bottom:3px;text-shadow:0 1px 3px #000}
#bossBar{margin-top:10px}#bossName{font-family:Georgia,serif;font-weight:900;color:#ff8a8a;font-size:16px;text-shadow:0 2px 4px #000;margin-bottom:3px}
#bossName small{display:block;font-size:11px;color:#ffc0c0;font-weight:400;font-style:italic}
#hudTR{position:absolute;right:12px;top:12px;display:flex;gap:8px}
.hbtn{background:rgba(30,20,12,.85);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:700;color:#ffe9b8}
.hbtn.on{background:linear-gradient(#ffd97a,#d89a2c);color:#2a1606}
#hudBL{position:absolute;left:14px;bottom:14px;width:260px}
#goldLbl{font-family:Georgia,serif;font-size:26px;font-weight:900;color:var(--gold);text-shadow:0 2px 0 #5a3a10,0 3px 8px #000;margin-top:6px}
#weapLbl{font-size:12px;opacity:.9;text-shadow:0 1px 2px #000;margin-top:2px}
#dashCd{height:4px;border-radius:2px;background:rgba(0,0,0,.5);margin-top:6px;overflow:hidden}#dashCd i{display:block;height:100%;background:#a0c8ff}
#nextWave{position:absolute;left:50%;top:78px;transform:translateX(-50%);text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 16px;pointer-events:auto;box-shadow:0 6px 20px rgba(0,0,0,.5)}
#nextWave .nwt{font-size:14px;margin-bottom:6px}#nextWave b{color:var(--gold);font-size:18px}
#nextWave .hint{font-size:11px;opacity:.7;margin-top:6px}
#mini{position:absolute;right:12px;bottom:12px;width:150px;height:150px;border-radius:50%;border:2px solid var(--line);background:rgba(0,0,0,.35)}
#quick{position:absolute;right:172px;bottom:14px;display:flex;flex-direction:column;gap:6px}
.qbtn{background:rgba(30,20,12,.88);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;color:#ffe9b8;text-align:left}
.qbtn small{display:block;font-weight:400;opacity:.75}
.qbtn:disabled{opacity:.45}
/* Shop */
#shop{position:fixed;right:10px;top:60px;bottom:172px;width:360px;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.6);z-index:5}
#shop header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px}
#shop header h3{margin:0;font-family:Georgia,serif;color:var(--gold);letter-spacing:1px}
#shopGold{font-family:Georgia,serif;font-weight:900;color:var(--gold);font-size:18px}
#shopTabs{display:flex;gap:4px;padding:0 8px 8px}
#shopTabs button{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:7px 2px;font-size:12px;font-weight:700}
#shopTabs button.on{background:linear-gradient(#ffd97a,#d89a2c);color:#2a1606;border-color:#fff0b0}
#shopList{flex:1;overflow-y:auto;padding:0 8px 10px;touch-action:pan-y}
.sh-sec{font-family:Georgia,serif;color:var(--gold);font-size:13px;margin:10px 4px 6px;letter-spacing:1px;text-transform:uppercase;opacity:.9}
.it{display:flex;align-items:center;gap:10px;padding:8px;margin-bottom:6px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;cursor:pointer;transition:background .12s,transform .06s}
.it:hover{background:rgba(255,207,90,.1)}.it:active{transform:scale(.98)}
.it .ic{width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(0,0,0,.3);border-radius:8px}
.it .ic canvas{width:38px;height:38px}
.it .tx{flex:1;min-width:0}.it .nm{font-weight:700;font-size:13px}.it .ds{font-size:11px;opacity:.75;margin-top:1px}
.it .lv{font-size:10px;color:var(--gold);font-weight:700}
.it .pr{flex:none;font-weight:900;font-family:Georgia,serif;color:var(--gold);font-size:13px;text-align:right;min-width:58px}
.it.no{opacity:.5}.it.no .pr{color:#ff8a7a}
.it.max .pr,.it.eq .pr{color:#6ee07a}
.it.eq{border-color:rgba(110,224,122,.5);background:rgba(110,224,122,.08)}
/* screens */
#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;pointer-events:none}
#screen>*{pointer-events:auto}
.scr{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 28px;max-width:min(980px,94vw);max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.7);touch-action:pan-y}
.scr h2{font-family:Georgia,serif;color:var(--gold);margin:0 0 4px;letter-spacing:2px}
.scr .sub{opacity:.75;margin-bottom:18px;font-size:14px}
.dim{position:fixed;inset:0;background:rgba(0,0,0,.5)}
.title{text-align:center;background:none;border:none;box-shadow:none}
.logo{font-family:Georgia,serif;font-size:clamp(54px,11vw,120px);font-weight:900;letter-spacing:8px;line-height:1;background:linear-gradient(#fff2b8,#ffcf5a 45%,#b8701a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #3a2208) drop-shadow(0 10px 24px rgba(0,0,0,.8))}
.logo small{display:block;font-size:.26em;letter-spacing:12px;margin-bottom:4px}
.tag{font-family:Georgia,serif;font-style:italic;font-size:18px;opacity:.9;margin:12px 0 30px;text-shadow:0 2px 6px #000}
.menuBtns{display:flex;flex-direction:column;gap:10px;align-items:center}
.menuBtns .btn{width:260px;font-size:17px;padding:13px}
.ver{position:fixed;bottom:10px;left:12px;font-size:12px;opacity:.6}
.badge{background:#e0303a;color:#fff;font-size:10px;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:middle}
.slots{display:grid;grid-template-columns:repeat(3,minmax(200px,1fr));gap:14px}
.slot{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:16px;cursor:pointer;transition:all .15s;min-height:190px;display:flex;flex-direction:column}
.slot:hover{border-color:var(--gold);background:rgba(255,207,90,.08);transform:translateY(-2px)}
.slot h4{margin:0 0 8px;font-family:Georgia,serif;color:var(--gold);font-size:18px}
.slot .st{font-size:13px;opacity:.85;line-height:1.6}
.slot .empty{flex:1;display:flex;align-items:center;justify-content:center;font-size:15px;opacity:.6;flex-direction:column;gap:6px}
.slot .empty b{font-size:38px;opacity:.7}
.slot .runtag{margin-top:auto;padding-top:8px;font-size:12px;color:#6ee07a;font-weight:700}
.slot .del{margin-top:8px;align-self:flex-end;background:none;border:1px solid rgba(255,100,100,.4);color:#ff9a9a;border-radius:6px;font-size:11px;padding:3px 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.hub{text-align:center;min-width:min(520px,94vw)}
.hub .menuBtns .btn{width:300px}
.hubstats{display:flex;gap:10px;justify-content:center;margin:8px 0 22px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 12px;font-size:13px}
.chip b{display:block;color:var(--gold);font-family:Georgia,serif;font-size:20px}
.perks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.perk{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px;cursor:pointer;transition:all .12s}
.perk:hover{border-color:var(--gold)}
.perk .ph{display:flex;align-items:center;gap:8px;font-weight:700}.perk .ph span{font-size:22px}
.perk .pd{font-size:12px;opacity:.8;margin:6px 0}
.perk .pips{display:flex;gap:3px;margin:6px 0}.perk .pips i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12)}.perk .pips i.on{background:var(--gold)}
.perk .pc{font-family:Georgia,serif;font-weight:900;color:var(--gold);font-size:13px}
.perk.no{opacity:.55}.perk.max .pc{color:#6ee07a}
.ptsbig{font-family:Georgia,serif;font-size:22px;color:var(--gold);font-weight:900}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:6px 12px;font-weight:700;font-size:13px}
.tabs button.on{background:linear-gradient(#ffd97a,#d89a2c);color:#2a1606}
.best{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.bc{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:6px;text-align:center;cursor:pointer;font-size:11px}
.bc:hover{border-color:var(--gold)}.bc canvas{width:96px;height:96px;display:block;margin:0 auto}
.bc .bn{font-weight:700;min-height:28px;display:flex;align-items:center;justify-content:center}
.bc.unk{opacity:.6}
.bdet{display:flex;gap:18px;align-items:flex-start;background:rgba(0,0,0,.25);border-radius:12px;padding:14px;margin-bottom:14px;border:1px solid var(--line)}
.bdet canvas{width:180px;height:180px;flex:none;background:radial-gradient(circle,rgba(90,120,60,.4),rgba(0,0,0,0) 70%);border-radius:12px}
.bdet h3{margin:0;font-family:Georgia,serif;color:var(--gold)}
.bdet .tierb{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:rgba(0,0,0,.4);margin:4px 0 8px}
.bdet p{margin:4px 0;font-size:13px;line-height:1.5;opacity:.9}
.bdet ul{margin:6px 0;padding-left:18px;font-size:13px}
.over h2{font-size:34px;color:#ff8a6a}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
/* toasts */
#toasts{position:fixed;inset:0;pointer-events:none;z-index:8}
#bigToast{position:absolute;left:50%;top:22%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .3s}
#bigToast.show{opacity:1}
#bigToast .t1{white-space:nowrap;font-family:Georgia,serif;font-size:clamp(28px,5vw,52px);font-weight:900;letter-spacing:3px;color:#fff;text-shadow:0 3px 0 #000,0 0 30px rgba(0,0,0,.8)}
#bigToast .t2{font-size:17px;margin-top:6px;text-shadow:0 2px 4px #000;font-style:italic}
#bigToast.boss .t1{color:#ff5a5a}#bigToast.elite .t1{color:#ffcf5a}#bigToast.good .t1{color:#8aff9a}
#feed{position:absolute;left:14px;top:120px;display:flex;flex-direction:column;gap:4px;max-width:340px}
.fd{background:rgba(0,0,0,.55);border-left:3px solid #ffcf5a;padding:5px 10px;border-radius:4px;font-size:13px;animation:fdin .25s;transition:opacity .5s}
.fd.new{border-color:#56b4ff}.fd.elite{border-color:#ffcf5a}.fd.good{border-color:#6ee07a}.fd.bad{border-color:#ff5a5a}.fd.boss{border-color:#ff3a5a;color:#ffc0c0}
@keyframes fdin{from{transform:translateX(-20px);opacity:0}}
/* touch */
#touch{display:none}
body.touch #touch.on{display:block}
#joyzone{position:fixed;left:0;top:90px;bottom:0;width:45vw;z-index:2}
#joybase{position:fixed;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.2);display:none;z-index:3;pointer-events:none}
#joyknob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,230,180,.5);border:2px solid rgba(255,255,255,.6)}
#btnDash{position:fixed;right:176px;bottom:24px;width:80px;height:80px;border-radius:50%;background:rgba(80,110,200,.55);border:2px solid rgba(200,220,255,.6);font-weight:900;z-index:3}
body.touch #quick{right:268px}
/* patch notes */
.notes{max-width:min(900px,96vw);padding:0;background:#16110c}
.notes .nh{position:sticky;top:0;background:linear-gradient(#2a1d12,#1d140c);padding:14px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;z-index:2}
.notes .nb{padding:10px 28px 40px;font-size:15px;line-height:1.65}
.notes h1{font-family:Georgia,serif;color:var(--gold);font-size:30px;margin:18px 0 4px}
.notes h2{font-family:Georgia,serif;color:var(--gold);font-size:22px;margin:34px 0 8px;border-bottom:1px solid var(--line);padding-bottom:6px;letter-spacing:1px}
.notes h3{color:#ffe0a0;margin:22px 0 6px;font-size:17px}
.notes img{width:100%;border-radius:10px;border:1px solid var(--line);margin:10px 0 4px;display:block;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.notes .cap{font-size:12px;opacity:.6;text-align:center;margin-bottom:12px;font-style:italic}
.notes ul{padding-left:22px}.notes li{margin:4px 0}
.notes .ov li b{color:#ffe0a0}
.notes .meta{opacity:.6;font-size:13px}
.notes table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}
.notes td,.notes th{border:1px solid rgba(255,255,255,.1);padding:5px 8px;text-align:left}
.notes th{background:rgba(255,207,90,.1);color:var(--gold)}
.notes .hl{background:rgba(255,207,90,.08);border-left:3px solid var(--gold);padding:10px 14px;border-radius:6px;margin:12px 0}
.help td{padding:4px 12px 4px 0;font-size:14px;vertical-align:top}
@media (max-width:760px){
  #shop{left:6px;right:6px;width:auto;top:auto;bottom:6px;height:56vh}
  .slots{grid-template-columns:1fr}
  #hudTop{top:64px;width:70vw}
  #hudTL{width:150px}#waveLbl{font-size:22px}
  #mini{width:100px;height:100px}
  #quick{right:120px}
  body.touch #quick{right:12px;bottom:120px}
  #btnDash{right:120px;bottom:16px}
  #nextWave{top:118px}
  .stats{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hidden">
  <div id="hudTL"><div id="waveLbl">WAVE 1</div><div id="waveSub"></div><div id="waveBar"><i></i></div></div>
  <div id="hudTop">
    <div class="campName">🏕️ <span id="campName">Campsite</span></div>
    <div class="bar big" id="campBar"><i></i><span></span></div>
    <div id="bossBar" class="hidden"><div id="bossName"></div><div class="bar boss"><i></i><span></span></div></div>
  </div>
  <div id="hudTR"><button class="hbtn" id="btnShop">🛒 Shop<kbd>B</kbd></button><button class="hbtn" id="btnPause">❚❚</button><button class="hbtn" id="btnMute">🔊</button></div>
  <div id="hudBL"><div class="bar hp" id="hpBar"><i></i><span></span></div><div id="dashCd"><i></i></div><div id="goldLbl">🪙 0</div><div id="weapLbl"></div></div>
  <div id="quick"><button class="qbtn" id="qPotion">🧪 Potion <kbd>Q</kbd><small></small></button><button class="qbtn" id="qRepair">🔨 Repair <kbd>R</kbd><small></small></button></div>
  <div id="nextWave" class="hidden"><div class="nwt">Next wave in <b id="nwT">10</b>s</div><button class="btn gold small" id="btnSkip">Start now ▶ <span id="skipBonus"></span></button><div class="hint">Shop is open — gear up! <kbd>N</kbd> to start</div></div>
  <canvas id="mini" width="300" height="300"></canvas>
</div>
<div id="shop" class="hidden">
  <header><h3>⚒ Quick Shop</h3><div id="shopGold">🪙 0</div><button class="hbtn" id="shopClose">✕</button></header>
  <div id="shopTabs"><button data-tab="weapons" class="on">⚔️ Weapons</button><button data-tab="gear">🛡️ Gear</button><button data-tab="camp">🏰 Camp</button><button data-tab="towers">🗼 Towers</button></div>
  <div id="shopList"></div>
</div>
<div id="screen"></div>

const ENEMIES = {};
const ENEMY_LIST = [];
const BY_TIER = [[], [], [], [], [], [], []];
const STAT_KEYS = { hp: 1, dmg: 1, spd: 1, r: 1, o: 1, shape: 1 };
FAMILIES.forEach(([fid, tier, shape, fname, base, opts, vars]) => {
  vars.forEach((v, i) => {
    const [name, col, acc, ai, m] = v;
    const d = {
      id: fid + '_' + i, fam: fid, famName: fname, tier, shape: m.shape || shape, name, col, acc, ai,
      hp: base.hp * (m.hp || 1), dmg: base.dmg * (m.dmg || 1), spd: base.spd * (m.spd || 1), r: Math.round(base.r * (m.r || 1)),
      o: Object.assign({}, opts, m.o || {}),
    };
    for (const k in m) if (!STAT_KEYS[k]) d[k] = m[k];
    if (d.ai === 'ranged' && !d.range) d.range = 250;
    ENEMIES[d.id] = d; ENEMY_LIST.push(d); BY_TIER[tier].push(d);
  });
});

const PROJ_NAMES = { rock: 'rocks', arrow: 'arrows', bolt: 'crossbow bolts', bomb: 'exploding bombs', spear: 'spears', fire: 'fireballs', orb: 'dark orbs', wail: 'sonic wails', lightning: 'lightning bolts', water: 'water jets', ice: 'ice shards', bone: 'bone spears', spike: 'tail spikes', bullet: 'bullets' };

function enemyDesc(d) {
  const t = [];
  const ai = {
    melee: 'Marches on your camp and attacks anything that gets in its way.',
    ranged: 'Keeps its distance and fires ' + (PROJ_NAMES[d.proj] || 'projectiles') + (d.aoe ? ' that explode on impact.' : '.'),
    bomber: 'Rushes forward and explodes on contact, damaging everything nearby.',
    healer: 'Hangs back and heals wounded allies around it.',
    summoner: d.summon ? 'Summons ' + (d.summon.scale < 1 ? 'small ' : '') + ENEMIES[d.summon.id].name + 's to fight for it.' : '',
    charger: 'Lowers its head, then charges at high speed.',
    blinker: 'Teleports in short blinks toward its target.',
  };
  t.push(ai[d.ai]);
  if (d.flying) t.push('Flies over your spike barricades.');
  if (d.slowHit) t.push('Its attacks chill and slow you.');
  if (d.burnHit) t.push('Its attacks set targets on fire.');
  if (d.poisonHit) t.push('Its attacks are poisonous.');
  if (d.lifesteal) t.push('Heals itself with every hit.');
  if (d.split) t.push('Splits into 2 ' + ENEMIES[d.split].name + 's when it dies.');
  if (d.revive) t.push('Reassembles itself once after being destroyed.');
  if (d.regen) t.push('Regenerates health over time.');
  if (d.armor) t.push('Armoured: takes ' + Math.round(d.armor * 100) + '% less damage.');
  if (d.dodge) t.push(Math.round(d.dodge * 100) + '% chance to evade attacks.');
  if (d.enrage) t.push('Becomes enraged below half health.');
  if (d.thorns) t.push('Its spiked hide hurts melee attackers.');
  if (d.swarm) t.push('Always arrives in packs of ' + d.swarm + '.');
  return t.join(' ');
}

// ================= SPRITE DRAWING =================
const TAU = Math.PI * 2;
function hexRgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(x => x + x).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
const _sc = {};
function shade(h, p) {
  const k = h + p; if (_sc[k]) return _sc[k];
  let [r, g, b] = hexRgb(h);
  if (p > 0) { r += (255 - r) * p; g += (255 - g) * p; b += (255 - b) * p; } else { r *= 1 + p; g *= 1 + p; b *= 1 + p; }
  return _sc[k] = `rgb(${r | 0},${g | 0},${b | 0})`;
}
const _ac = {};
function rgba(h, a) { const k = h + a; if (_ac[k]) return _ac[k]; const [r, g, b] = hexRgb(h); return _ac[k] = `rgba(${r},${g},${b},${a})`; }
const OLC = 'rgba(20,12,8,0.55)';
let OL = true;
function _fs(c, f, ol) { c.fillStyle = f; c.fill(); if (ol && OL) { c.strokeStyle = OLC; c.lineWidth = 1.3; c.stroke(); } }
function circle(c, x, y, r, f, ol = true) { c.beginPath(); c.arc(x, y, Math.max(0.1, r), 0, TAU); _fs(c, f, ol); }
function ellipse(c, x, y, rx, ry, f, ol = true, rot = 0) { c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU); _fs(c, f, ol); }
function rrect(c, x, y, w, h, r, f, ol = true) { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); _fs(c, f, ol); }
function poly(c, p, f, ol = true) { c.beginPath(); c.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) c.lineTo(p[i], p[i + 1]); c.closePath(); _fs(c, f, ol); }
function line(c, x1, y1, x2, y2, col, w) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.stroke(); }
function glow(c, x, y, r, col, a = 0.5) { const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0)); c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }
function shadow(c, rx, ry) { c.beginPath(); c.ellipse(0, 0, rx, ry, 0, 0, TAU); c.fillStyle = 'rgba(0,0,0,0.28)'; c.fill(); }

function drawHead(c, d, o, t, x, y) {
  const s = d.col, a = d.acc, h = o.head;

      if (h === 'troll') { ellipse(c, x + 8, y + 1, 5, 3, shade(s, -0.08)); line(c, x - 4, y - R, x - 8, y - R - 5, '#3a2a1a', 2); }

// ---------- coin ----------
function drawCoin(c, x, y, t, v) {
  const s = v >= 25 ? 1.5 : v >= 5 ? 1.2 : 1;
  const w = Math.abs(Math.cos(t * 4 + x)) * 4 * s + 1;
  ellipse(c, x, y + 4, 4 * s, 1.5, 'rgba(0,0,0,0.25)', false);
  ellipse(c, x, y - 2 + Math.sin(t * 5 + y) * 1.5, w, 4.4 * s, v >= 25 ? '#ffe9a0' : '#ffcc30');
}

function renderGround(R) {
  const S = R * 2 + 400, cv = document.createElement('canvas'); cv.width = S; cv.height = S;
  const c = cv.getContext('2d'); const o = S / 2;
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  if (cam.shake > 0) cam.shake = Math.max(0, cam.shake - dt * 40);

// ---------------- menu backdrop ----------------
function menuWorld() {
  G.run = { wave: 12, camp: { lvl: 2, spikes: 2, banner: 2, brazier: 1, tl: { archer: 3, cannon: 2, mage: 2, frost: 1 }, towers: ['archer', 'mage', 'cannon', 'frost'], guards: 0 }, gear: { armor: 4 }, melee: 'knight', ranged: 'longbow' };
  makeWorld();
  W.camp.lvl = 2; W.camp.r = CAMP_LEVELS[2].r; Object.assign(W.camp, { spikes: 2, banner: 2, brazier: 1 }); W.wallPieces = campWallPieces(W.camp);
  const n = 4; W.towers = G.run.camp.towers.map((type, i) => { const a = -Math.PI * 0.75 + i / n * TAU; return { type, x: Math.cos(a) * (W.camp.r - 6), y: Math.sin(a) * (W.camp.r - 6), aim: a }; });
  W.player.x = 120; W.player.y = 40; W.player.face = 1;
  W.menuE = [];
  for (let i = 0; i < 26; i++) { const d = pick(ENEMY_LIST.filter(x => x.tier <= 4 && x.shape !== 'boss')); const a = Math.random() * TAU, r = rand(300, 700); W.menuE.push({ d, x: Math.cos(a) * r, y: Math.sin(a) * r, r: d.r, t: Math.random() * 10, face: 1, mv: true, hp: 1, maxHp: 1, atk: 0, flash: 0, state: 'walk' }); }
  W.enemies = W.menuE;
  cam.x = 0; cam.y = -10;
}
function menuSim(dt) {
  for (const e of W.enemies) { const d = Math.hypot(e.x, e.y); e.t += dt; if (d > W.camp.r + 140) { e.x -= e.x / d * e.d.spd * 0.5 * dt; e.y -= e.y / d * e.d.spd * 0.5 * dt; e.mv = true; } else { const a = Math.random() * TAU, r = rand(650, 900); e.x = Math.cos(a) * r; e.y = Math.sin(a) * r; } e.face = e.x < 0 ? 1 : -1; }
  W.player.t = (W.player.t || 0) + dt; W.player.swingAnim = Math.max(0, Math.sin(W.t * 2) * 1.2 - 0.2);
  cam.x = Math.cos(W.t * 0.08) * 60; cam.y = Math.sin(W.t * 0.08) * 40 - 10;
}

// ---------------- input ----------------
function setupInput() {
  window.addEventListener('keydown', e => {
    if (e.target && (e.target.tagName === 'INPUT')) return;
    keys[e.code] = true;
    if (G.mode !== 'play') { if (e.code === 'Escape') UI.back(); return; }
    if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') { keys.dash = true; e.preventDefault(); }
    if (e.code === 'KeyB' || e.code === 'Tab' || e.code === 'KeyE') { UI.toggleShop(); e.preventDefault(); }
    if (e.code === 'Escape' || e.code === 'KeyP') UI.togglePause();
    if (e.code === 'KeyN' && W && W.phase === 'inter') UI.skipWait();
    if (e.code === 'KeyQ') UI.quickPotion();
    if (e.code === 'KeyR') UI.quickRepair();
    if (e.code.startsWith('Arrow')) e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (G.mode === 'play' && !G.paused && W && W.phase !== 'over') UI.togglePause(true); });
  const jz = document.getElementById('joyzone'), knob = document.getElementById('joyknob'), base = document.getElementById('joybase');
  const upd = (x, y) => { let dx = x - joy.sx, dy = y - joy.sy; const l = Math.hypot(dx, dy), m = 55; if (l > m) { dx = dx / l * m; dy = dy / l * m; } joy.dx = dx / m; joy.dy = dy / m; knob.style.transform = `translate(${dx}px,${dy}px)`; };
  jz.addEventListener('touchstart', e => { const t = e.changedTouches[0]; joy.active = true; joy.id = t.identifier; joy.sx = t.clientX; joy.sy = t.clientY; base.style.display = 'block'; base.style.left = (t.clientX - 60) + 'px'; base.style.top = (t.clientY - 60) + 'px'; upd(t.clientX, t.clientY); e.preventDefault(); }, { passive: false });
  jz.addEventListener('touchmove', e => { for (const t of e.changedTouches) if (t.identifier === joy.id) upd(t.clientX, t.clientY); e.preventDefault(); }, { passive: false });
  const end = e => { for (const t of e.changedTouches) if (t.identifier === joy.id) { joy.active = false; joy.dx = joy.dy = 0; base.style.display = 'none'; knob.style.transform = ''; } };
  jz.addEventListener('touchend', end); jz.addEventListener('touchcancel', end);
  document.getElementById('btnDash').addEventListener('touchstart', e => { keys.dash = true; e.preventDefault(); }, { passive: false });
  document.getElementById('btnDash').addEventListener('mousedown', () => { keys.dash = true; });
  window.addEventListener('touchstart', () => document.body.classList.add('touch'), { once: true });
}

<p>Your camp has <b>5 levels</b>, and every level <b>visibly changes</b> how it looks:</p>
<table><tr><th>Level</th><th>Look</th><th>Tower slots</th><th>Guards</th></tr>
<tr><td>Campsite</td><td>A tent, a campfire and a rope fence</td><td>2</td><td>1</td></tr>
<tr><td>Outpost</td><td>A wooden palisade, a second tent and a flag</td><td>3</td><td>2</td></tr>
<tr><td>Fort</td><td>Thicker log walls and three tents</td><td>4</td><td>3</td></tr>
<tr><td>Stronghold</td><td>Stone walls with battlements and a stone keep</td><td>6</td><td>4</td></tr>
<tr><td>Citadel</td><td>Gold-trimmed walls, blue banners and a crystal spire</td><td>8</td><td>5</td></tr></table>
<ul>
<li><b>Fortify Walls</b> (+15% camp HP per level) and <b>Reinforce</b> (5% less damage per level) make the camp tougher.</li>
<li><b>Spike Barricade</b> hurts every ground enemy that attacks the walls. Flying enemies avoid it.</li>
<li><b>Healing Brazier</b> slowly repairs the camp and heals you quickly while you're inside it.</li>
<li><b>War Banner</b> gives more gold from kills.</li>
<li><b>Guards</b> are spearmen who patrol the walls, fight anything that gets close, and respawn if they fall. Guard Training makes them stronger.</li>
</ul>

<h2>🗼 Defence Towers</h2>
<p>Build towers into your camp's slots. Each tower type has its own level (up to <b>15</b>), and upgrading a type upgrades every tower of that type.</p>
<ul>${TOWER_IDS.map(id => `<li><b>${TOWERS[id].icon} ${TOWERS[id].name}</b>: ${TOWERS[id].desc}</li>`).join('')}</ul>
<p>Towers always aim at the enemy <b>closest to the camp</b>, so they deal with the biggest threat first.</p>

<h2>👹 ${ENEMY_LIST.length} Enemies</h2>
${pnImg('horde', 'A mixed horde from the later tiers')}
<p>There are <b>${FAMILIES.length} families of monsters</b>, each with <b>3 variants</b>, for a total of <b>${ENEMY_LIST.length} enemies</b> across 6 tiers. Variants don't just change colour. They fight differently:</p>
<ul>
<li><b>Melee</b> enemies march on the camp. <b>Ranged</b> enemies hang back and shoot arrows, fireballs, bombs, lightning and more.</li>
<li><b>Bombers</b> run in and explode. <b>Chargers</b> lower their heads and charge. <b>Blinkers</b> teleport toward you.</li>
<li><b>Healers</b> patch up their allies, and <b>Summoners</b> keep calling in reinforcements. Take them out first!</li>
<li>Look out for <b>armoured</b>, <b>regenerating</b>, <b>splitting</b>, <b>reviving</b>, <b>evasive</b>, <b>vampiric</b> and <b>flying</b> enemies.</li>
</ul>
<h3>Full roster</h3>
<table>${roster}</table>

<h2>✦ Elite Waves</h2>
${pnImg('elite', 'An Elite champion leads the charge')}
<p><b>Every 5th wave</b> (that isn't a boss wave) is an <b>Elite Wave</b>. A champion from the highest tier joins the horde. It's <b>almost twice the size</b>, has <b>12× health</b> and <b>nearly double damage</b>, and drops a huge pile of gold. From Wave 25, elite waves bring <b>two</b> champions.</p>
<p>Each Elite rolls one random affix:</p>
<ul>${ELITE_AFFIXES.map(a => `<li><b style="color:${a.col}">${a.name}</b>: ${a.desc}</li>`).join('')}</ul>

<h2>☠️ ${BOSSES.length} Unique Bosses</h2>
${pnImg('boss1', 'King Gloop, the Gelatinous Monarch, mid-leap')}
${pnImg('boss2', 'Pyrothrax the Ember Wyrm calls down a Meteor Storm')}
<p><b>Every 10th wave</b> is a <b>Boss Wave</b>. Every boss is a completely different kind of monster, with its own model and its own set of attacks. Red zones on the ground warn you where an attack is about to land, so keep moving and save your dash.</p>
${BOSSES.map(b => `<h3>Wave ${b.wave}: ${b.name}, ${b.title}</h3><p>${b.desc}</p><ul>${b.moves.map(m => `<li>${m}</li>`).join('')}</ul>`).join('')}
<p>After Wave 100 the bosses come back as <b>Ascended</b> versions, with much more health.</p>
${pnImg('boss3', 'Eclipse, the World Eater, fills the sky with starfire')}

<h2>⭐ Camp Points &amp; Perks</h2>
${pnImg('perks', 'The Perks screen')}
<p>Every wave you clear earns <b>Camp Points</b>: 1 point, plus 1 for every 5 waves you've reached, plus <b>+2</b> for elite waves and <b>+5</b> for boss waves. Points are added <b>straight away</b>, so you keep them even if your camp falls.</p>
<p>Spend them on <b>${PERKS.length} permanent perks</b> that apply to every future run in that save slot:</p>
<ul>${PERKS.map(p => `<li>${p.icon} <b>${p.name}</b> (max Lv ${p.max}): ${p.desc(p.max)}</li>`).join('')}</ul>
<p>Changed your mind? <b>Refund all perks</b> gives every point back.</p>

<h2>📖 Bestiary</h2>
${pnImg('bestiary', 'The Bestiary, with a creature selected')}
<p>Every creature you meet is added to the <b>Bestiary</b>. Each one has a portrait, its tier, a description of how it fights, its base stats and how many you've killed. Creatures you haven't met yet show up as silhouettes. There are <b>${ENEMY_LIST.length + BOSSES.length} entries</b> to fill in!</p>

<h2>💾 Save Slots</h2>
${pnImg('slots', 'Three save slots')}
<ul>
<li><b>3 save slots</b>. Each one has its own Camp Points, perks, bestiary, stats and saved run.</li>
<li>The game <b>auto-saves at the start of every break between waves</b>. Close the tab whenever you like and <b>Continue Run</b> later.</li>
<li>Rename a slot with the ✎ button. To delete a slot, click Delete twice.</li>
</ul>

<h2>Other Changes</h2>
<ul>
<li>A <b>minimap</b> in the corner shows every enemy, colour-coded by tier, with elites in gold and bosses in red.</li>
<li>Arrows at the edge of the screen point to off-screen elites and bosses.</li>
<li>Damage numbers, screen shake, particles and hit flashes for every attack.</li>
<li>A health bar appears over damaged enemies, coloured by tier.</li>
<li>New enemies are announced the first time you see them.</li>
<li>Sound effects for combat, coins, waves and bosses, with a mute button.</li>
<li>The game pauses automatically if you switch tabs.</li>
<li>Your armour visibly changes colour as you upgrade, and you get a tabard and then a cape at higher tiers.</li>
<li>Your equipped bow or gun is shown on your back.</li>
<li>Camps below 35% health start to smoke.</li>
<li>Trails worn into the grass show where the monsters come from.</li>
</ul>
<p style="text-align:center;margin-top:30px;opacity:.7"><i>Hold the line, defender. The camp is counting on you.</i></p>`;
